[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chronicle-git"
version = "0.1.0"
description = "Git repository history analysis and visualization — contributors, files, heatmaps, collaboration networks, code trends"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "Chronicle Contributors"}]
keywords = ["git", "analysis", "visualization", "history", "contributors", "heatmap"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Version Control :: Git",
]

[project.scripts]
chronicle = "chronicle.cli:main"

[tool.setuptools.packages.find]
include = ["chronicle*"]

[tool.setuptools.package-data]
chronicle = ["web/*.html", "web/*.css", "web/*.js"]
